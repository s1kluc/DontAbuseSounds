[package]
name = "dont-abuse-sounds"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
cpal = "0.17"
ringbuf = "0.4"
rubato = "0.16"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac", "ogg", "vorbis", "mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
