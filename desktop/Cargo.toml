[package]
name = "dont-abuse-sounds"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
cpal = "0.17"
ringbuf = "0.4"
rubato = "0.16"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac", "ogg", "vorbis", "mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry",
    "Win32_System_SystemInformation", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
