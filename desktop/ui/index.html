<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DontAbuseSounds</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>DontAbuseSounds</h1>
      <button id="import">Import project</button>
    </header>
    <section class="routing" aria-label="Audio routing">
      <label>Hardware microphone<select id="input"><option value="">Microphone off</option></select></label>
      <label>Soundboard output<select id="output"><option value="">Choose an output</option></select></label>
      <div class="controls">
        <button id="start" class="primary" disabled>Start audio</button>
        <button id="refresh">Refresh devices</button>
      </div>
      <p id="guide">In Discord, select <strong>DontAbuseSounds Mic</strong> as your input and use headphones for Discord playback.</p>
      <p id="status" role="status" aria-live="polite">Audio stopped.</p>
    </section>
    <div class="pad-heading">
      <h2>Sound pads</h2>
      <button id="stop" disabled>Stop all sounds</button>
    </div>
    <section id="pads" class="pads" aria-label="Sound pads"></section>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
