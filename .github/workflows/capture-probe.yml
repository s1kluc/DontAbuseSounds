name: Windows capture probe
on:
  push:
    paths:
      - 'drivers/windows/capture-probe/**'
      - 'desktop/**'
      - '.github/workflows/capture-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
      - name: Build and test capture effect without installing it
        working-directory: drivers/windows/capture-probe
        run: |
          cl /nologo /std:c++17 /EHsc /W4 test.cpp /Fetone-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tone-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /EHsc /W4 /MD /LD probe.cpp clip_feed.cpp /FeDontAbuseSoundsCaptureProbe.dll AudioBaseProcessingObjectV140.lib audiomediatypecrt.lib AudioEng.lib ole32.lib shell32.lib uuid.lib /link /EXPORT:DllGetClassObject /EXPORT:DllCanUnloadNow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /EHsc /W4 host_test.cpp /Fehost-test.exe audiomediatypecrt.lib ole32.lib shell32.lib uuid.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./host-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./host-test.exe clip
          exit $LASTEXITCODE
      - name: Check read-only device enumeration
        working-directory: drivers/windows/capture-probe
        run: ./CaptureSetup.ps1 -Action List
      - uses: actions/upload-artifact@v4
        with:
          name: DontAbuseSounds-Capture-Probe-Windows-x64
          path: |
            drivers/windows/capture-probe/DontAbuseSoundsCaptureProbe.dll
            drivers/windows/capture-probe/CaptureSetup.ps1
            drivers/windows/capture-probe/README.md
          if-no-files-found: error
      - name: Build Windows EXE with microphone setup
        working-directory: desktop
        run: |
          $env:DAS_CAPTURE_DLL = (Resolve-Path '../drivers/windows/capture-probe/DontAbuseSoundsCaptureProbe.dll').Path
          rustup update stable --no-self-update
          cargo +stable test --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/dont-abuse-sounds.exe target/release/DontAbuseSounds-Microphone-Test.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DontAbuseSounds-Microphone-Test-Windows-x64
          path: desktop/target/release/DontAbuseSounds-Microphone-Test.exe
          if-no-files-found: error
