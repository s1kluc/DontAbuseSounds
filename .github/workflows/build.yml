name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["windows-latest"]' || '["windows-latest", "ubuntu-22.04", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualMixer-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VirtualMixer-Windows-X64
          path: dist
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          unzip -j dist/*.zip '*.exe' -d dist
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.zip \
            --target "$GITHUB_SHA" --title "Virtual Mixer $GITHUB_REF_NAME" \
            --notes "Windows x64 standalone soundboard. Download VirtualMixer.exe or extract the ZIP package. Python is not required. The executable is unsigned. Virtual audio routing requires a separately installed driver such as VB-CABLE. Audio routing on real Windows hardware has not been verified."
