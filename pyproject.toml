[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-mixer"
version = "0.1.1"
description = "Native soundboard with explicit virtual audio routing"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7", "sounddevice>=0.5,<0.6", "soundfile>=0.13,<0.14", "numpy>=2,<3", "soxr>=1,<2"]

[project.scripts]
virtual-mixer = "virtual_mixer.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.12,<7", "Pillow>=11,<13"]

[tool.setuptools.package-data]
virtual_mixer = ["assets/icon.png"]

[tool.setuptools.packages.find]
include = ["virtual_mixer*"]
